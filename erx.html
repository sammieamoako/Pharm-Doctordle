<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERx | Clinical AR HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --ar-blue: #3b82f6; --ar-rose: #f43f5e; --ar-emerald: #10b981; }
        
        body { 
            background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
            font-family: 'Inter', sans-serif; min-height: 100vh; 
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        
        /* Glassmorphism AR HUD Interface */
        .ar-hud {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 3rem; width: 100%; max-width: 500px; 
            padding: 2.5rem; position: relative;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.2);
        }

        /* The IV Infusion Stake (Bottom-Right) */
        .iv-status-cluster {
            position: absolute;
            bottom: 130px; 
            right: 25px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }

        .iv-container { 
            width: 30px; height: 65px; 
            display: flex; flex-direction: column; align-items: center;
            position: relative;
        }

        .iv-bag { 
            width: 24px; height: 40px; 
            border: 1.5px solid rgba(59, 130, 246, 0.4); 
            border-radius: 4px 4px 10px 10px;
            position: relative; overflow: hidden; 
            background: rgba(255, 255, 255, 0.1);
        }

        .iv-fluid { 
            position: absolute; bottom: 0; width: 100%; 
            background: linear-gradient(to top, var(--ar-blue), #93c5fd);
            opacity: 0.6; transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            height: 100%; 
        }

        .drop {
            width: 4px; height: 4px; background: #60a5fa; border-radius: 50%;
            position: absolute; top: 42px;
            box-shadow: 0 0 10px var(--ar-blue);
            animation: drip 1.2s infinite; opacity: 0;
        }

        @keyframes drip {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: 1; }
            80% { transform: translateY(22px); opacity: 1; }
            100% { transform: translateY(28px); opacity: 0; }
        }

        /* Letter Display Slots */
        .pill-slot {
            width: 36px; height: 50px; background: rgba(255, 255, 255, 0.4);
            border: 1px solid white; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; font-weight: 900; color: #1e293b;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pill-slot.revealed { 
            background: var(--ar-emerald); color: white; border-color: transparent;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); transform: translateY(-3px);
        }

        /* Clinical Keyboard */
        .key { 
            height: 46px; background: rgba(255, 255, 255, 0.7); border: 1px solid white; 
            border-radius: 10px; font-weight: 700; color: #475569; transition: 0.2s;
        }
        .key:active { transform: scale(0.92); }
        .key.hit { background: var(--ar-emerald); color: white; border: none; }
        .key.miss { background: var(--ar-rose); color: white; border: none; opacity: 0.3; }

        #ecg-wave { transition: d 0.3s ease, stroke 0.3s ease; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.4)); }
        .timer-glow { text-shadow: 0 0 12px rgba(244, 63, 94, 0.3); }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-3xl">
        <div class="text-center p-8 max-w-sm w-full">
            <h1 class="text-4xl font-black italic tracking-tighter text-white mb-2 drop-shadow-lg">ER<span class="text-blue-400">x</span></h1>
            <p class="text-[9px] font-black uppercase tracking-[0.4em] text-blue-100/60 mb-10">Neural Interface v4.0</p>
            <div class="space-y-4">
                <input type="text" id="user-name" placeholder="DOCTOR USERNAME" class="w-full p-4 bg-white/10 border border-white/20 rounded-2xl font-bold uppercase text-center text-white placeholder-white/40 outline-none focus:bg-white/20 transition-all">
                <input type="email" id="user-email" placeholder="ACCESS EMAIL" class="w-full p-4 bg-white/10 border border-white/20 rounded-2xl font-bold text-center text-white placeholder-white/40 outline-none focus:bg-white/20 transition-all">
            </div>
            <button id="checkin-btn" class="w-full mt-10 bg-white text-slate-900 font-black py-4 rounded-2xl uppercase tracking-[0.2em] text-xs shadow-2xl active:scale-95 transition-all">Engage AR HUD</button>
        </div>
    </div>

    <div id="vitals-monitor" class="ar-hud">
        
        <div class="iv-status-cluster">
            <span class="text-[7px] font-black text-blue-500/80 uppercase tracking-widest mb-2">Infusion</span>
            <div class="iv-container">
                <div class="iv-bag">
                    <div id="iv-fluid" class="iv-fluid"></div>
                </div>
                <div id="drop" class="drop"></div>
            </div>
        </div>

        <header class="mb-8">
            <div class="flex justify-between items-end mb-4 px-2">
                <div>
                    <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-1">Telemetry HR</span>
                    <div class="text-3xl font-black text-slate-800"><span id="bpm">72</span> <small class="text-xs font-bold text-slate-400">BPM</small></div>
                </div>
                <div class="text-right">
                    <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-1">Triage Window</span>
                    <div id="timer" class="mono text-2xl font-black text-rose-500 timer-glow">00:30</div>
                </div>
            </div>
            <svg viewBox="0 0 400 60" class="w-full h-14 overflow-visible">
                <path d="M0,30 L400,30" class="stroke-slate-200 stroke-[1] fill-none" />
                <path id="ecg-wave" class="fill-none stroke-blue-500 stroke-[3]" d="M0,30 L400,30" />
            </svg>
        </header>

        <main>
            <div class="mb-8 p-5 bg-white/30 rounded-3xl border border-white/50 shadow-inner">
                <span class="text-blue-600 text-[8px] font-black uppercase tracking-widest block mb-2">Patient Profile</span>
                <p id="presentation" class="text-sm font-semibold text-slate-700 leading-relaxed italic">Synchronizing database...</p>
            </div>

            <div id="word-display" class="flex flex-wrap justify-center gap-2 mb-12 min-h-[50px]"></div>

            <div id="keyboard" class="grid grid-cols-7 gap-2"></div>
        </main>

        <div id="outcome" class="hidden absolute inset-0 bg-white/95 backdrop-blur-2xl rounded-[3rem] flex flex-col items-center justify-center p-8 z-30 text-center">
            <h2 id="outcome-title" class="text-4xl font-black uppercase tracking-tighter mb-2"></h2>
            <p id="outcome-desc" class="text-sm font-bold text-slate-400 mb-8"></p>
            <div>
                <span class="text-[10px] font-black text-slate-300 uppercase tracking-[0.3em] block mb-2">Rotation Credits</span>
                <div id="final-score" class="text-7xl font-black text-slate-900">0</div>
            </div>
            <button onclick="location.reload()" class="mt-10 px-12 py-4 bg-slate-900 text-white rounded-full font-black text-[10px] uppercase tracking-[0.2em] shadow-xl active:scale-95 transition-all">Restart Shift</button>
        </div>
    </div>

    <script type="module" src="erx.js"></script>
</body>
</html>
